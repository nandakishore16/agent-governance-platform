<svg width="680" height="440" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Agent governance platform architecture</title>
<desc>A coordinator routes tasks to a researcher, doer, and reviewer agent; the researcher and doer call tools that feed back to the coordinator, and every step logs to a governance layer.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="440" fill="#ffffff"/>

<g>
<rect x="270" y="40" width="140" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="60" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Coordinator</text>
<text x="340" y="78" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Routes each step</text>
</g>

<line x1="330" y1="96" x2="135" y2="140" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="96" x2="340" y2="140" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="350" y1="96" x2="545" y2="140" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<g>
<rect x="60" y="140" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="135" y="160" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Researcher</text>
<text x="135" y="178" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Gathers findings</text>
</g>

<g>
<rect x="265" y="140" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="160" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Doer</text>
<text x="340" y="178" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Takes an action</text>
</g>

<g>
<rect x="470" y="140" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="545" y="160" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Reviewer</text>
<text x="545" y="178" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Checks doer's work</text>
</g>

<line x1="135" y1="196" x2="135" y2="240" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="196" x2="340" y2="240" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<g>
<rect x="60" y="240" width="150" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="135" y="260" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">RAG lookup</text>
<text x="135" y="278" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">Feeds back up</text>
</g>

<g>
<rect x="265" y="240" width="150" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="260" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Action tools</text>
<text x="340" y="278" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">Feeds back up</text>
</g>

<text x="545" y="260" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">&#8635; back to coordinator</text>

<line x1="340" y1="296" x2="340" y2="340" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<g>
<rect x="60" y="340" width="560" height="56" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="360" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Governance layer</text>
<text x="340" y="378" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">SQLite + Langfuse tracing, surfaced in the Gradio dashboard</text>
</g>
</svg>
